[tool.black]
line-length = 100
target-version = ["py312"]
exclude = ["storage"]

[tool.ruff]
target-version = "py312"
line-length = 100
ignore = ["E203"]
exclude = [
    "storage",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "Q"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]

[tool.streamlit]
server.headless = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "cli",
    "config",
    "data",
    "engine",
    "home",
    "model_builder",
    "models",
    "optimizer",
    "portfolio",
    "storage",
]
